<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>News Headlines</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }
        h1 {
            margin-bottom: 24px;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            align-items: center;
        }
        .toolbar form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        select, input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #e5e7eb;
        }
        .card-body {
            padding: 16px;
        }
        .meta {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        .card a {
            color: #111827;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .empty {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Latest Headlines</h1>

    <div th:if="${!apiConfigured}" class="warning">
        NewsAPI key is missing. Set the NEWS_API_KEY environment variable before running the application.
    </div>

    <div class="toolbar">
        <form method="get" action="/">
            <label>
                <span>Category:</span>
                <select name="category">
                    <option value="general" th:selected="${selectedCategory == 'general'}">General</option>
                    <option value="business" th:selected="${selectedCategory == 'business'}">Business</option>
                    <option value="entertainment" th:selected="${selectedCategory == 'entertainment'}">Entertainment</option>
                    <option value="health" th:selected="${selectedCategory == 'health'}">Health</option>
                    <option value="science" th:selected="${selectedCategory == 'science'}">Science</option>
                    <option value="sports" th:selected="${selectedCategory == 'sports'}">Sports</option>
                    <option value="technology" th:selected="${selectedCategory == 'technology'}">Technology</option>
                </select>
            </label>
            <label>
                <span>Search:</span>
                <input type="text" name="query" th:value="${searchTerm}" placeholder="Type keyword..." />
            </label>
            <button type="submit">Refresh</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(articles)}" class="empty">
        No headlines available for the current filters.
    </div>

    <div th:unless="${#lists.isEmpty(articles)}" class="news-grid">
        <div class="card" th:each="article : ${articles}">
            <img th:if="${article.urlToImage != null and !#strings.isEmpty(article.urlToImage)}" th:src="${article.urlToImage}" alt="Article image" />
            <div class="card-body">
                <div class="meta" th:text="${article.source != null ? article.source.name : 'Unknown source'} + ' • ' + ${article.publishedAt}" />
                <a th:href="${article.url}" target="_blank" rel="noopener noreferrer" th:text="${article.title}"></a>
                <p th:text="${article.description != null ? article.description : 'No description available.'}"></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
